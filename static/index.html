<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollable results area */
    #results-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 0;
    }

    /* Empty state */
    #empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #333;
      letter-spacing: 0.04em;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      padding-bottom: 20px;
    }

    .card {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      background: #141414;
      contain: layout paint; /* perf: isolate each card */
    }
    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      will-change: transform; /* hint GPU layer */
    }
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.18s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px 12px;
      gap: 5px;
    }
    .card:hover .card-overlay { opacity: 1; }
    .card-similarity { font-size: 12px; font-weight: 600; color: #fff; }
    .card-name { font-size: 10px; color: #aaa; line-height: 1.3; word-break: break-all; }
    .card-btn {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      cursor: pointer;
      width: fit-content;
      transition: background 0.12s;
    }
    .card-btn:hover { background: rgba(255,255,255,0.22); }

    /* Skeleton */
    .skeleton {
      border-radius: 6px;
      aspect-ratio: 16/9;
      background: linear-gradient(90deg, #141414 25%, #1c1c1c 50%, #141414 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Bottom bar */
    #bottom-bar {
      padding: 16px 20px;
      background: #0a0a0a;
      border-top: 1px solid #181818;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    form {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 600px;
      background: #161616;
      border: 1px solid #272727;
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    form:focus-within { border-color: #404040; }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #e8e8e8;
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
    }
    input[type="text"]::placeholder { color: #3a3a3a; }

    button[type="submit"] {
      background: #fff;
      color: #0a0a0a;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      margin: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.12s;
      letter-spacing: 0.01em;
    }
    button[type="submit"]:hover { opacity: 0.85; }
    button[type="submit"]:disabled { opacity: 0.3; cursor: default; }

    #meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #333;
    }
    #status { color: #444; }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #333;
    }
    .controls input[type="range"] { accent-color: #555; width: 72px; cursor: pointer; }
    .controls span { color: #444; min-width: 16px; }
  </style>
</head>
<body>

<div id="results-area">
  <div id="empty">200 images indexed — search to begin</div>
  <div id="grid" style="display:none"></div>
</div>

<div id="bottom-bar">
  <form id="search-form">
    <input type="text" id="query" placeholder="Describe what you're looking for…" autocomplete="off" spellcheck="false" />
    <button type="submit" id="search-btn">Search</button>
  </form>
  <div id="meta-row">
    <span id="status"></span>
    <div class="controls">
      <span>Results</span>
      <input type="range" id="top-n" min="3" max="30" value="12" />
      <span id="top-n-val">12</span>
    </div>
    <div class="controls">
      <span>Min match</span>
      <input type="range" id="threshold" min="0" max="90" value="35" />
      <span id="threshold-val">35%</span>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('search-form');
  const queryInput = document.getElementById('query');
  const searchBtn = document.getElementById('search-btn');
  const topNSlider = document.getElementById('top-n');
  const topNVal = document.getElementById('top-n-val');
  const thresholdSlider = document.getElementById('threshold');
  const thresholdVal = document.getElementById('threshold-val');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');

  topNSlider.addEventListener('input', () => { topNVal.textContent = topNSlider.value; });
  thresholdSlider.addEventListener('input', () => { thresholdVal.textContent = thresholdSlider.value + '%'; });

  fetch('/count').then(r => r.json()).then(d => {
    empty.textContent = `${d.count} images indexed — search to begin`;
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const query = queryInput.value.trim();
    if (!query) return;

    const topN = parseInt(topNSlider.value);
    searchBtn.disabled = true;
    searchBtn.textContent = 'Searching…';
    status.textContent = '';

    // Show skeletons
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = Array(topN).fill('<div class="skeleton"></div>').join('');

    try {
      const res = await fetch('/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, top_n: topN, min_similarity: parseFloat(thresholdSlider.value) }),
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const { results } = await res.json();

      status.textContent = `${results.length} results`;
      grid.innerHTML = '';

      // Build fragment for single reflow
      const frag = document.createDocumentFragment();
      for (const item of results) {
        const encoded = encodeURIComponent(item.filename);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="/image/${encoded}" loading="eager" decoding="async" alt="">
          <div class="card-overlay">
            <div class="card-similarity">${item.similarity}%</div>
            <div class="card-name">${item.filename}</div>
            <button class="card-btn" data-fn="${encoded}">Open in Finder</button>
          </div>`;
        frag.appendChild(card);
      }
      grid.appendChild(frag);

      grid.querySelectorAll('.card-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          fetch(`/open/${btn.dataset.fn}`);
        });
      });

    } catch (err) {
      status.textContent = `Error: ${err.message}`;
      grid.innerHTML = '';
      empty.style.display = 'flex';
      grid.style.display = 'none';
    } finally {
      searchBtn.disabled = false;
      searchBtn.textContent = 'Search';
    }
  });
</script>
</body>
</html>
